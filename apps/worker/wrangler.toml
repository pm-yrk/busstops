# Cloudflare Worker configuration for the Bus Stops. edge API.
#
# Secrets are never listed here. Set them with `wrangler secret put <NAME>`:
#   BODS_API_KEY, TFL_APP_KEY, VEHICLE_SALT_SECRET
# Non-secret configuration goes in [vars]; bindings are declared below.

name = "busstops-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Keep the Worker on the free plan explicitly: no usage-based pricing path.
workers_dev = true

[observability]
enabled = true

[vars]
GOVERNOR_MODE = "green"
FEATURE_FLAGS_JSON = "{}"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "busstops-artifacts"

[[kv_namespaces]]
binding = "CACHE"
# Replace with the real namespace id at provisioning time; never a secret.
id = "REPLACE_AT_PROVISIONING"

[env.preview]
name = "busstops-api-preview"

[env.preview.vars]
GOVERNOR_MODE = "green"
FEATURE_FLAGS_JSON = "{}"

[[env.preview.r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "busstops-artifacts-preview"
