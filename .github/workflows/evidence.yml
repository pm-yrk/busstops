name: Evidence

# Runs the diagnostics and writes what they saw back into the repository.
#
# Why it exists: this session's GitHub token lost its Actions scope mid-build — `workflow_dispatch`
# answers "Actions has been disabled for this user" and a run that was read in full an hour earlier
# now 404s — while pushes and the repository's own Actions continue to work normally. A push
# trigger therefore still runs, and committing the reports into `evidence/` puts them somewhere
# readable over git rather than only in a run log.
#
# It costs nothing when it is not wanted: every job is gated on `[evidence]` appearing in the
# pushed commit's message. Preview only. Nothing here can touch production.
#
# Pushes made with GITHUB_TOKEN do not start new workflow runs, so the commit this makes cannot
# retrigger it.

on:
  push:
    branches:
      - claude/bus-stops-platform-build-f7qztb

permissions:
  contents: write

concurrency:
  group: evidence-${{ github.ref }}
  cancel-in-progress: false

env:
  WORKER_ENV: preview
  R2_BUCKET_ARTIFACTS: busstops-artifacts-preview

jobs:
  # The live-data question: why does a viewport with hundreds of buses in it come back empty
  # through the deployment? The Worker is redeployed first, so the probe runs against this commit.
  probe:
    name: Probe the deployed API, and ask BODS the same question
    if: contains(github.event.head_commit.message, '[evidence]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --no-audit --no-fund

      - name: Deploy the preview Worker
        id: worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          npx --no-install wrangler deploy \
            --config apps/worker/wrangler.toml \
            --env "$WORKER_ENV" 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$URL" ] || { echo "::error::No Worker URL in the wrangler output."; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Configure Worker runtime secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BODS_API_KEY: ${{ secrets.BODS_API_KEY }}
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
          VEHICLE_SALT_SECRET: ${{ secrets.VEHICLE_SALT_SECRET }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
        run: |
          # Piped on stdin, never as arguments: an argument appears in the process list.
          set -u
          for NAME in BODS_API_KEY TFL_APP_KEY VEHICLE_SALT_SECRET UNSUBSCRIBE_SECRET; do
            [ -n "${!NAME:-}" ] || { echo "::error::Repository secret $NAME is empty."; exit 1; }
            printf '%s' "${!NAME}" | npx --no-install wrangler secret put "$NAME" \
              --config apps/worker/wrangler.toml --env "$WORKER_ENV" >/dev/null \
              && echo "  $NAME: set" \
              || { echo "::error::Failed to set Worker secret $NAME"; exit 1; }
          done

      - name: Wait for the Worker
        run: |
          for attempt in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
              "${{ steps.worker.outputs.url }}/v1/sources/health" || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "Worker healthy on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $CODE"
            sleep 10
          done
          echo "::error::The Worker did not become healthy."
          exit 1

      - name: Probe the deployment
        run: |
          set -o pipefail
          mkdir -p evidence
          npx tsx scripts/probe-deployment.ts \
            --worker "${{ steps.worker.outputs.url }}" \
            --json evidence/deployment-probe.json 2>&1 | tee evidence/probe.log

      # The independent request. Same viewports, same minute, straight to the source.
      - name: Ask the upstreams directly
        if: always()
        env:
          BODS_API_KEY: ${{ secrets.BODS_API_KEY }}
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
        run: |
          set -o pipefail
          mkdir -p evidence
          npx tsx scripts/diagnose-upstreams.ts \
            --json evidence/upstream-diagnosis.json 2>&1 | tee evidence/upstreams.log

      # Handed to the publish job rather than committed here. Two jobs committing to one branch
      # is what made a healthy evidence run go red: both rewrote `evidence/README.md`, so the
      # second job's rebase hit a content conflict in that file and all four retries failed on
      # the rebase that was already in progress.
      - name: Hand the probe's output to the publish job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-probe
          path: evidence
          retention-days: 1
          if-no-files-found: ignore

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Probe"
            echo
            echo '```'
            sed -n '1,200p' evidence/probe.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The timetable question: what is actually inside the BODS GTFS archives, and does the streaming
  # reader hold up against a national one?
  gtfs:
    name: Measure the GTFS timetable downloads
    if: contains(github.event.head_commit.message, '[evidence]')
    needs: probe
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --no-audit --no-fund

      - name: Measure
        env:
          BODS_API_KEY: ${{ secrets.BODS_API_KEY }}
          # Headroom for the trip and service-id indexes, not for file contents: the reader
          # streams. It spends nothing — the runner's memory is already paid for.
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          set -o pipefail
          mkdir -p evidence
          {
            echo "# Runner before the measurement"
            df -h /
            free -h
          } > evidence/gtfs-host.log
          npx tsx scripts/measure-gtfs.ts \
            --regions all,yorkshire,north_west \
            --json evidence/gtfs-measurement.json 2>&1 | tee evidence/gtfs.log

      - name: Hand the measurement to the publish job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-gtfs
          path: evidence
          retention-days: 1
          if-no-files-found: ignore

      - name: Summarise
        if: always()
        run: |
          {
            echo "## GTFS measurement"
            echo
            echo '```'
            sed -n '1,200p' evidence/gtfs.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # What each candidate map-projection grid would cost, read off the published artifact.
  #
  # Its own marker and its own job, deliberately. The question — how much smaller a city viewport
  # gets if the projection is filed on a smaller square, and how many more objects that is to
  # write — was answered three times by running a national build, and two of those runs died at a
  # step limit with nothing published at all. A single pass over 460 objects answers it in
  # minutes. This job deploys nothing and writes nothing to the bucket; it reads, re-files the
  # rows in memory, and reports.
  #
  # Pushed here rather than as an input to `deploy-preview` because that workflow's concurrency
  # group holds one run at a time, and a two-minute measurement should not queue behind a
  # two-and-a-half-hour build.
  map_grid:
    name: Measure what each map-projection grid would cost
    if: contains(github.event.head_commit.message, '[map-grid]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --no-audit --no-fund

      - name: Measure
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # The whole projection's rows are held at once to re-file them; the bytes themselves are
          # released per tile. Headroom rather than a requirement, and the runner's memory is
          # already paid for either way.
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          set -o pipefail
          npx tsx scripts/measure-map-grid.ts \
            --json map-grid.json 2>&1 | tee map-grid.log

      - name: Summarise
        if: always()
        run: |
          {
            echo "## What each map-projection grid would cost"
            echo
            echo '```'
            sed -n '1,120p' map-grid.log 2>/dev/null || echo "no map-grid.log was written"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-map-grid
          path: |
            map-grid.json
            map-grid.log
          retention-days: 7
          if-no-files-found: ignore

  # Re-files the published map projection onto the grid MAP_STOP_TILE_DEGREES names.
  #
  # `[retile]` reports and writes nothing. `[retile-apply]` additionally writes the new tiles,
  # reads every one of them back, and then moves the index — one object, after everything else has
  # been verified, so until that write the artifact serves exactly what it served before. The
  # tiles it replaces are left in place, which is what makes a rollback one index write.
  #
  # Not part of the national build, because a finer grid is a repartition of rows that are already
  # published and none of the build's work is needed to compute it. That build takes between 99
  # and 165 minutes — measured, same inputs, ten hours apart — and the extra objects have twice
  # pushed it past its step limit with nothing published at all.
  retile_map_stops:
    name: Re-file the map projection onto a smaller square
    if: contains(github.event.head_commit.message, '[retile]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --no-audit --no-fund

      - name: Re-file
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # The grid, from the same variable the national build reads, so the two cannot be asked
          # for different things by different means.
          MAP_STOP_TILE_DEGREES: "0.0625"
          NODE_OPTIONS: "--max-old-space-size=8192"
          # Through the environment, not interpolated into the script. A commit message is
          # attacker-controlled text on a public repository, and `${{ }}` substitution happens
          # before the shell sees the line — so a message with a backtick in it would run.
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -o pipefail
          APPLY=""
          if printf '%s' "$HEAD_COMMIT_MESSAGE" | grep -q '\[retile-apply\]'; then
            APPLY="--apply"
            echo "Applying: tiles will be written and the index swapped."
          else
            echo "Report only. Add [retile-apply] to the commit message to publish."
          fi
          npx tsx pipelines/static-network/run-retile-map-stops.ts $APPLY \
            --json retile.json 2>&1 | tee retile.log

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Re-filing the map projection"
            echo
            echo '```'
            sed -n '1,120p' retile.log 2>/dev/null || echo "no retile.log was written"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-retile
          path: |
            retile.json
            retile.log
          retention-days: 14
          if-no-files-found: ignore

  # One commit, after both measurements, whatever either of them did.
  #
  # Each measurement job hands its files over as an artifact and this job is the only thing that
  # writes to the branch, so there is no second pusher to race and no shared file written twice.
  # `if: always()` because a failed measurement is itself evidence — the point is to get back what
  # the runner saw, and a job that fell over has usually written the most interesting part of it.
  publish:
    name: Commit what the runners saw
    if: always() && contains(github.event.head_commit.message, '[evidence]')
    needs: [probe, gtfs]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Both into `evidence/`, and neither job writes a file the other does, so the merge is
      # flat and order does not matter.
      # Tolerant, because "no artifact at all" is a real outcome: a probe that died before its
      # first write uploads nothing, and this job must still finish rather than report a failure
      # of its own on top of the one that matters.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: evidence-*
          merge-multiple: true
          path: evidence

      - name: Commit it
        run: |
          ls -la evidence || true
          node scripts/commit-evidence.mjs run \
            "probe: ${{ needs.probe.result }} · gtfs: ${{ needs.gtfs.result }}"
