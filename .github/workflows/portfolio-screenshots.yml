name: Portfolio screenshots

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/portfolio-screenshots.yml"

permissions:
  actions: read
  contents: write

concurrency:
  group: portfolio-screenshots
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Download visual QA from the latest successful preview deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list \
            --workflow deploy-preview.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::No successful Deploy Preview run was found."
            exit 1
          fi

          echo "Using Deploy Preview run $RUN_ID"
          rm -rf /tmp/busstops-visual-qa
          mkdir -p /tmp/busstops-visual-qa docs/portfolio
          gh run download "$RUN_ID" \
            --name preview-visual-qa \
            --dir /tmp/busstops-visual-qa

          cp /tmp/busstops-visual-qa/desktop-home.png docs/portfolio/busstops-home.png
          cp /tmp/busstops-visual-qa/desktop-pro.png docs/portfolio/busstops-pro.png

      - name: Keep the latest screenshots in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add docs/portfolio/busstops-home.png docs/portfolio/busstops-pro.png
          if git diff --cached --quiet; then
            echo "Portfolio screenshots are already current."
          else
            git commit -m "Refresh Bus Stops portfolio screenshots"
            git push origin HEAD:main
          fi
