name: Portfolio screenshots

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/portfolio-screenshots.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Save the current build screenshot as a static portfolio image
        run: |
          cp docs/portfolio/busstops-home.png docs/portfolio/busstops-static-2026-09-04.png

      - name: Commit the static screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add docs/portfolio/busstops-static-2026-09-04.png
          if git diff --cached --quiet; then
            echo "Static screenshot already exists."
          else
            git commit -m "Add static Bus Stops portfolio screenshot"
            git push origin HEAD:main
          fi
