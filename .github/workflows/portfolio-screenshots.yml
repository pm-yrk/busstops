name: Portfolio screenshots

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/portfolio-screenshots.yml"

permissions:
  actions: read
  contents: write

concurrency:
  group: portfolio-screenshots
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Download visual QA from the latest successful preview deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list \
            --workflow deploy-preview.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::No successful Deploy Preview run was found."
            exit 1
          fi

          echo "Using Deploy Preview run $RUN_ID"
          rm -rf /tmp/busstops-visual-qa
          mkdir -p /tmp/busstops-visual-qa docs/portfolio
          gh run download "$RUN_ID" \
            --name preview-visual-qa \
            --dir /tmp/busstops-visual-qa

      - name: Create fresh README JPEGs
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image

          pairs = [
              ("/tmp/busstops-visual-qa/desktop-home.png", "docs/portfolio/busstops-home-v7.jpg"),
              ("/tmp/busstops-visual-qa/desktop-pro.png", "docs/portfolio/busstops-pro-v7.jpg"),
          ]

          for source, target in pairs:
              image = Image.open(source).convert("RGB")
              image.save(target, "JPEG", quality=82, optimize=True, progressive=False)
              check = Image.open(target)
              check.verify()
          PY
          file docs/portfolio/busstops-home-v7.jpg docs/portfolio/busstops-pro-v7.jpg

      - name: Point README at the fresh images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("README.md")
          text = path.read_text()
          text = re.sub(
              r"!\[Bus Stops current build\]\([^\n]+\)",
              "![Bus Stops current build](docs/portfolio/busstops-home-v7.jpg)",
              text,
          )
          text = re.sub(
              r"!\[Bus Stops Pro current build\]\([^\n]+\)",
              "![Bus Stops Pro current build](docs/portfolio/busstops-pro-v7.jpg)",
              text,
          )
          path.write_text(text)
          PY

      - name: Commit README and screenshots normally with git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add README.md docs/portfolio/busstops-home-v7.jpg docs/portfolio/busstops-pro-v7.jpg
          git status --short
          git commit -m "Fix Bus Stops README screenshots"
          git push origin HEAD:main
