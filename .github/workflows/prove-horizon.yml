name: Prove the departure horizon

# A one-minute question with a two-hour answer everywhere else.
#
# Departure shards are keyed by service date, so "can the site say what is due today?" is answered by
# the bucket, not by the code. This lists it and counts the objects physically present for each date
# at the version the index names. It writes nothing, so it is safe against any bucket at any time, and
# it exists so that question never again requires a rebuild to answer.

on:
  workflow_dispatch:
    inputs:
      bucket:
        description: "Artifact bucket to inspect"
        type: choice
        default: busstops-artifacts-preview
        options:
          - busstops-artifacts-preview
          - busstops-artifacts
      horizon_days:
        description: "Service dates to ask about, counting today"
        type: string
        # Three, matching what the refresh publishes.
        #
        # Asking about four while the refresh writes three means the fourth is always absent, the
        # proof always reports `covered_using_slack`, and a warning that fires on every run is a
        # warning nobody reads. The two numbers have to move together, and this is the one that is
        # cheap to move: the refresh's horizon is bounded by R2's account-wide allowance.
        default: "3"
  schedule:
    # After each refresh, so a refresh that silently did nothing is visible rather than inferred.
    #
    # The 06:12 firing did not happen at all on 14 October — GitHub drops scheduled events under
    # load — and a proof that does not run is indistinguishable from a horizon that is fine. Each
    # of these sits roughly an hour after one of the refresh's three crons. It writes nothing, so
    # running it three times is free in every sense that matters.
    - cron: "12 6 * * *"
    - cron: "21 13 * * *"
    - cron: "31 20 * * *"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - name: Count what is actually in the bucket
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_BUCKET_ARTIFACTS: ${{ inputs.bucket || 'busstops-artifacts-preview' }}
          SERVICE_DATE_HORIZON_DAYS: ${{ inputs.horizon_days || '3' }}
        run: npx tsx pipelines/static-network/prove-horizon.ts
      - name: Repeat the answer where the log can reach it
        if: always()
        run: cat horizon-report.json || echo "no horizon-report.json was written"
