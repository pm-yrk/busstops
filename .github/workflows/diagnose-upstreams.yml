name: Diagnose upstreams

# What the upstreams actually return, right now, from a runner.
#
# The preview reported zero live buses while every structural check passed. Four different things
# produce that symptom — the request never left, it was refused, the body was empty, or the body
# was full and we rejected all of it — and only an independent request made at the same moment can
# tell them apart. This is that request.
#
# It prints counts, statuses and timings. It never prints a credential or a source vehicle
# reference: keys are redacted from every logged URL and vehicles are counted, not echoed.

on:
  workflow_dispatch:
  # Runs on the hour during the working day so a "zero buses at 09:00" claim can be checked
  # against what the feed was doing at 09:00, rather than against what it is doing now.
  schedule:
    - cron: "5 7-18 * * 1-5"

permissions:
  contents: read

jobs:
  diagnose:
    name: Ask every upstream directly
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --no-audit --no-fund

      - name: Probe
        env:
          BODS_API_KEY: ${{ secrets.BODS_API_KEY }}
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
        run: |
          npx tsx scripts/diagnose-upstreams.ts --json upstream-diagnosis.json 2>&1 | tee diagnosis.log

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Upstream diagnosis"
            echo
            echo "UTC now: $(date -u +%FT%TZ)"
            echo
            echo '```'
            sed -n '1,200p' diagnosis.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-diagnosis
          path: |
            upstream-diagnosis.json
            diagnosis.log
          retention-days: 7
