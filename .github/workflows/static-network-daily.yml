name: Static network — daily change check

# Daily fingerprint check (docs/07_DATA_PIPELINES.md). A full national rebuild runs only when a
# source actually changed; an unchanged check is still recorded so "nothing happened" is
# distinguishable from "the job did not run".

on:
  # No schedule. Dispatch only, until there is a production deployment to rebuild *for*.
  #
  # This fired for the first time in six weeks on 14 October and was killed by its own 30-minute
  # cap inside "Check fingerprints and rebuild if changed" — which is not bad luck. The BODS
  # catalogue changes daily, so the fingerprint check always decides to rebuild, and a national
  # build takes about forty-five minutes. The job could therefore never finish: it would spend
  # thirty minutes a day downloading England and be guillotined, every day, with whatever it had
  # written left behind.
  #
  # Nor is finishing it the fix. The production bucket holds a 4 September artifact of 3.27 GB
  # whose departure horizon ran out weeks ago — `coverage 2026-10-14: 0 departures` — and R2's
  # 10 GB free allowance is account-wide, with the preview bucket already at 9.68 GB. A completed
  # rebuild would add roughly another 3 GB to an account that is already over. So the honest state
  # is: nothing serves this bucket, and rebuilding it daily costs money and reclaims nothing.
  #
  # Restoring the schedule is one line, and the thing to decide first is what production is for.
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Rebuild even when fingerprints are unchanged"
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time: a second concurrent rebuild would double the storage operations
# and could interleave two manifest swaps.
concurrency:
  group: static-network
  cancel-in-progress: false

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    # Hard runtime cap so a hung upstream cannot consume the Actions budget.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci --no-audit --no-fund

      - name: Free-tier preflight
        run: npm run preflight

      - name: Check fingerprints and rebuild if changed
        env:
          BODS_API_KEY: ${{ secrets.BODS_API_KEY }}
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_BUCKET_ARTIFACTS: ${{ vars.R2_BUCKET_ARTIFACTS || 'busstops-artifacts' }}
          # Headroom for the indexes the streamed build holds — stops, routes, the calendar and
          # the trips inside the horizon — not for file contents: the archive is read as a stream
          # and the journeys spill to disk. Node's default heap is a fraction of the runner's
          # 16 GB, and this spends nothing: the memory is already paid for by the runner.
          NODE_OPTIONS: "--max-old-space-size=12288"
          # Pinned to what this schedule has always published, so merging the preview work does
          # not silently widen the production horizon. Every extra service date costs about 1.27 GB
          # of R2 against a 10 GB allowance for the whole account, and this bucket serves the
          # production site; widening it is a decision, not a side effect of a merge.
          SERVICE_DATE_HORIZON_DAYS: "2"
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: npx tsx pipelines/static-network/run-daily.ts

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-network-report
          path: build-report.json
          retention-days: 7
          if-no-files-found: ignore
