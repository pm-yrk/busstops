name: Static network — weekly reconciliation

# Full England reconciliation regardless of change hints (docs/07_DATA_PIPELINES.md): a source
# can republish an identical fingerprint while its content has drifted, so once a week the whole
# network is rebuilt and compared, producing a Network Changes report.

on:
  schedule:
    - cron: "30 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-network
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci --no-audit --no-fund

      - name: Reconcile the national network
        env:
          BODS_API_KEY: ${{ secrets.BODS_API_KEY }}
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_BUCKET_ARTIFACTS: ${{ vars.R2_BUCKET_ARTIFACTS || 'busstops-artifacts' }}
          # A national build holds the NaPTAN CSV and every decompressed timetable document in
          # memory at once, and Node's default heap is a fraction of the runner's 16 GB.
          NODE_OPTIONS: "--max-old-space-size=12288"
        run: npx tsx pipelines/static-network/run-weekly.ts

      - name: Upload network changes report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-changes-report
          path: network-changes.json
          retention-days: 30
          if-no-files-found: ignore
