name: Intelligence — bounded live collection

# The scheduled intelligence path (docs/07_DATA_PIPELINES.md "Live collection"). Entirely
# separate from the user path: browsers never trigger this, and it never fetches a national feed
# on a browser's behalf.
#
# Budget arithmetic, kept explicit so a cadence change is a visible decision rather than a drift:
# every 30 minutes is 48 runs a day; each run is capped at 10 minutes, so the worst case is
# 480 minutes a day, about 14,600 a month. The self-imposed ceiling for Actions is half of the
# 50,000 free minutes, so this sits inside it with the weekly and daily network jobs alongside.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Never two collectors at once: a second would double the upstream request spend for data the
# first is already fetching.
concurrency:
  group: intelligence-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci --no-audit --no-fund

      - name: Free-tier preflight
        run: npm run preflight

      - name: Collect bounded live observations
        env:
          BODS_API_KEY: ${{ secrets.BODS_API_KEY }}
          VEHICLE_SALT_SECRET: ${{ secrets.VEHICLE_SALT_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_BUCKET_ARTIFACTS: ${{ vars.R2_BUCKET_ARTIFACTS }}
          BUDGET_UTILIZATION: ${{ vars.BUDGET_UTILIZATION }}
          MAX_PARTITIONS_PER_RUN: ${{ vars.MAX_PARTITIONS_PER_RUN }}
          BODS_DAILY_REQUEST_BUDGET: ${{ vars.BODS_DAILY_REQUEST_BUDGET }}
        run: npx tsx pipelines/live-collection/run-collect.ts

      - name: Upload collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-report
          path: collection-report.json
          retention-days: 3
          if-no-files-found: ignore
