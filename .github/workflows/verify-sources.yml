name: Verify sources and artifacts

# Runs the adapters against real upstream responses.
#
# It is a separate, manual workflow rather than part of CI or of a deploy: an upstream having a bad
# minute is not a reason to fail a build, and a source registry should be updated by someone who
# has read what came back. Run it, read the summary, then set contractVerification from what it
# actually observed — never from what it was expected to observe.
#
# Requests are deliberately tiny: one bounding box, one stop, a cancelled prefix of the NaPTAN CSV.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-sources
  cancel-in-progress: false

jobs:
  # What the upstreams actually return, right now, from a runner.
  #
  # The preview reported zero live buses while every structural check passed. Four different
  # things produce that symptom — the request never left, it was refused, the body was empty, or
  # the body was full and we rejected all of it — and only an independent request made at the
  # same moment can tell them apart. This is that request. It prints counts, statuses and
  # timings, never a credential or a source vehicle reference.
  diagnose:
    name: Ask every upstream directly
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --no-audit --no-fund

      - name: Probe
        env:
          BODS_API_KEY: ${{ secrets.BODS_API_KEY }}
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
        run: |
          # pipefail, because `| tee` otherwise replaces the probe's exit code with tee's: the
          # first run of this step crashed on a transform error and reported success.
          set -o pipefail
          npx tsx scripts/diagnose-upstreams.ts --json upstream-diagnosis.json 2>&1 | tee diagnosis.log

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Upstream diagnosis"
            echo
            echo "UTC now: $(date -u +%FT%TZ)"
            echo
            echo '```'
            sed -n '1,220p' diagnosis.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-diagnosis
          path: |
            upstream-diagnosis.json
            diagnosis.log
          retention-days: 7

  # What the GTFS timetable downloads actually contain.
  #
  # The static network takes the first 60 of 945 published TransXChange datasets, which is why a
  # stop in Manchester comes back with no routes. BODS publishes its own GTFS extract, nationally
  # and by region, and the choice between them — and whether a two-day horizon holds enough — is
  # a measurement, not a preference. This makes it: download sizes, inflated entry sizes, row
  # counts, services and trips inside the horizon, and how long stop_times takes to stream.
  gtfs:
    name: Measure the GTFS timetable downloads
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --no-audit --no-fund

      - name: Disk before
        run: df -h /

      - name: Measure
        env:
          BODS_API_KEY: ${{ secrets.BODS_API_KEY }}
          # The reader streams, so this is headroom for the trip and service-id indexes rather
          # than for file contents. It spends nothing: the runner's memory is already paid for.
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          set -o pipefail
          npx tsx scripts/measure-gtfs.ts \
            --regions all,yorkshire,north_west \
            --json gtfs-measurement.json 2>&1 | tee gtfs.log

      - name: Summarise
        if: always()
        run: |
          {
            echo "## GTFS timetable measurement"
            echo
            echo '```'
            sed -n '1,200p' gtfs.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gtfs-measurement
          path: |
            gtfs-measurement.json
            gtfs.log
          retention-days: 7
          if-no-files-found: ignore

  verify:
    name: Fetch and parse real upstream responses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci --no-audit --no-fund

      - name: Verify
        env:
          BODS_API_KEY: ${{ secrets.BODS_API_KEY }}
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
        run: |
          set -o pipefail
          npx tsx scripts/verify-live-sources.ts 2>&1 | tee verification.log

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Live source verification"
            echo
            echo '```'
            cat verification.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the structured report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-verification
          path: source-verification.json
          retention-days: 30
          if-no-files-found: warn

  inspect:
    name: Measure the published artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci --no-audit --no-fund

      # Whether a national dataset fits in an edge isolate is a number, and nothing else prints it.
      - name: Artifact sizes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_BUCKET_ARTIFACTS: busstops-artifacts-preview
        run: |
          set -o pipefail
          node scripts/inspect-artifacts.mjs 2>&1 | tee artifacts.log
          {
            echo "## Published artifact sizes"
            echo
            echo '```'
            cat artifacts.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  basemap:
    name: Verify the basemap terms and origins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci --no-audit --no-fund

      # The CSP has to name every host the style pulls from, and the only way to know them is to
      # read the style. This also proves the tiles still serve without a key.
      - name: Basemap
        run: |
          set -o pipefail
          node scripts/verify-basemap.mjs 2>&1 | tee basemap.log
          {
            echo "## Basemap"
            echo
            echo '```'
            cat basemap.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
